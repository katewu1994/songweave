[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-vector-map"
version = "1.2.0"
description = "SongWeave: an explainable local music atlas (CLI: mvm)"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=2",
    "scipy>=1.11",
    "soundfile>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# PE-AV runs in the main environment (transformers 5 ships PeAudioVideoModel).
models = ["torch>=2.5", "transformers>=5,<6", "timm>=1.0", "pillow", "huggingface_hub"]
dev = ["pytest>=8"]

[project.scripts]
mvm = "music_vector_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires downloaded model weights (slow)"]
