# SongWeave v1.2 runtime configuration.
# Paths are relative to the repository root unless stated otherwise.

[project]
manifest = "data/manifest.json"
artifacts_dir = "artifacts"
export_dir = "artifacts/export"

[analysis]
# CPU float32 is the correctness baseline; MPS must pass tests/test_mps_parity before use.
device = "cpu"
# Windows whose RMS is below this level are declared silent and skipped.
silence_dbfs = -60.0

[backends.overall_peav]
view_id = "overall_peav"
model = "facebook/pe-av-small"
revision = "dd050762bb9704ae9cd996ca45532a98f81d817e"
sample_rate = 48000
window_seconds = 10.0
hop_seconds = 10.0

[backends.merit]
views = ["melody_merit", "rhythm_merit", "timbre_merit"]
backbone = "m-a-p/MERT-v1-330M"
backbone_revision = "5240c2708a5acaee1007f43fb9735c7dcd0b78c9"
heads_repo = "amaai-lab/merit"
heads_revision = "a85df30eca1ba112eb594285f3ba1d96488e7883"
layers = [3, 4, 5, 6, 23]
sample_rate = 24000
window_seconds = 30.0
hop_seconds = 15.0
# MERT remote code needs transformers 4.x, so MERIT runs in its own environment.
python = ".venvs/merit/bin/python"

[backends.lyrics_sonar]
view_id = "lyrics_sonar"
encoder = "text_sonar_basic_encoder"
default_lang = "jpn_Jpan"
max_lines_per_block = 4
# fairseq2n is pinned to torch 2.9.1, so SONAR runs in its own environment.
python = ".venvs/sonar/bin/python"

[meta_api]
# enabled = the module is in scope. It never triggers a request by itself.
# Owner requested local translation with no API calls (2026-11-04).
enabled = false
base_url = "https://api.meta.ai/v1"
# "*-contributor" model IDs allow Meta to train on prompts and are refused by code.
model = "muse-spark-1.3"
key_env = ["META_API_KEY", "MODEL_API_KEY"]
max_items_per_job = 6
timeout_seconds = 240
max_completion_tokens = 12000
# Default language of generated text: "en", "ja" or "zh-Hans" (override per job with --lang).
output_language = "en"

[export]
neighbors_k = 5
map_neighbor_lines = 3
excerpts_per_pair = 2
